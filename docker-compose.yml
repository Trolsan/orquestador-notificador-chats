services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orquestador-api
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: orquestador-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: ${TZ:-America/Bogota}
      TZ: ${TZ:-America/Bogota}
      # Reference for HTTP Request node in workflows (Fase 6)
      API_INTERNAL_URL: http://api:8000
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  n8n_data:
